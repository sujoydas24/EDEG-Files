<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container my-5">
        <h2 class="text-center mb-4">Your Shopping Cart</h2>

        <!-- Cart Items -->
        <div class="row">
            <!-- Product 1 -->
            <div class="col-md-8">
                <div class="card mb-3">
                    <div class="row g-0 align-items-center">
                        <div class="col-md-4">
                            <img src="https://via.placeholder.com/200" class="img-fluid rounded-start" alt="Product Image">
                        </div>
                        <div class="col-md-8">
                            <div class="card-body">
                                <h5 class="card-title">Product 1</h5>
                                <p class="card-text">Price: $50.00</p>
                                <div class="d-flex align-items-center">
                                    <label for="quantity1" class="me-2">Qty:</label>
                                    <input type="number" id="quantity1" class="form-control w-25 me-3" value="1" min="1">
                                    <button class="btn btn-danger btn-sm">Remove</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Product 2 -->
            <div class="col-md-8">
                <div class="card mb-3">
                    <div class="row g-0 align-items-center">
                        <div class="col-md-4">
                            <img src="https://via.placeholder.com/200" class="img-fluid rounded-start" alt="Product Image">
                        </div>
                        <div class="col-md-8">
                            <div class="card-body">
                                <h5 class="card-title">Product 2</h5>
                                <p class="card-text">Price: $30.00</p>
                                <div class="d-flex align-items-center">
                                    <label for="quantity2" class="me-2">Qty:</label>
                                    <input type="number" id="quantity2" class="form-control w-25 me-3" value="2" min="1">
                                    <button class="btn btn-danger btn-sm">Remove</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Summary Section -->
        <div class="col-md-4 offset-md-8">
            <div class="card">
                <div class="card-body">
                    <h4 class="card-title">Cart Summary</h4>
                    <hr>
                    <div class="d-flex justify-content-between">
                        <p>Subtotal:</p>
                        <p>$110.00</p>
                    </div>
                    <div class="d-flex justify-content-between">
                        <p>Tax (10%):</p>
                        <p>$11.00</p>
                    </div>
                    <div class="d-flex justify-content-between fw-bold">
                        <p>Total:</p>
                        <p>$121.00</p>
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between">
                        <a href="#" class="btn btn-secondary">Continue Shopping</a>
                        <a href="#" class="btn btn-primary">Checkout</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
